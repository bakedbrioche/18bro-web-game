map "$uri|$http_sec_fetch_site|$http_sec_fetch_mode|$http_sec_fetch_dest|$http_accept" $deny_static_asset_request {
    default 0;
    ~*^[^|]+\.(?:mjs|css|png|jpe?g|webp|svg|apng|glb|gltf|bin|ttf|woff2?|mp3|wav|json)\|cross-site\| 1;
    ~*^[^|]+\.(?:mjs|css|png|jpe?g|webp|svg|apng|glb|gltf|bin|ttf|woff2?|mp3|wav|json)\|[^|]*\|navigate\|document\| 1;
    ~*^[^|]+\.(?:mjs|css|png|jpe?g|webp|svg|apng|glb|gltf|bin|ttf|woff2?|mp3|wav|json)\|[^|]*\|[^|]*\|[^|]*\|.*text/html 1;
}

map $uri $asset_cache_control {
    default "public, max-age=300, must-revalidate";
    /index.html "no-cache, no-store, must-revalidate";
    /healthz "no-cache, no-store, must-revalidate";
}

map $uri $asset_robots {
    default "";
    ~*\.(?:mjs|css|png|jpe?g|webp|svg|apng|glb|gltf|bin|ttf|woff2?|mp3|wav|json)$ "noindex, noarchive";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    if ($deny_static_asset_request) {
        return 404;
    }

    # The runtime is read-only. No public route accepts state-changing verbs.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Cache-Control $asset_cache_control always;
    add_header X-Robots-Tag $asset_robots always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~* \.glb$ {
        default_type model/gltf-binary;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
