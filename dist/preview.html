<!doctype html><html lang="en"><meta charset="utf-8"><title>18Bro scene review</title>
<style>body{margin:0;background:#101820;color:#e6f0d5;font:15px system-ui}canvas{display:block;width:100vw;height:calc(100vh - 58px)}nav{height:58px;display:flex;align-items:center;gap:16px;padding:0 20px}input{width:42vw}a{color:#b9ed87}</style>
<canvas id="review"></canvas><nav><label>Scene <select id="scene"><option value="intro">Store heist</option><option value="capture">Police carry-away</option><option value="street">Street</option></select></label><label>Timeline <input id="progress" type="range" min="0" max="100" step="1" value="0"></label><output id="time"></output><a href="/">Back to game</a></nav>
<script type="module">
import {RunnerGame,INTRO_DURATION} from './core.mjs';import {GameScene} from './scene.mjs';
const canvas=document.querySelector('canvas'),s=new GameScene(canvas),g=new RunnerGame(),mode=document.querySelector('select'),progress=document.querySelector('input');
g.start();s.captureStarts=s.cops.map((c,i)=>c.root.position.set(i?1:-1,0,3).clone());
function frame(){const t=Number(progress.value)/100;g.state=mode.value==='intro'?'STARTING':mode.value==='capture'?'CAUGHT':'RUNNING';g.introProgress=t;g.captureProgress=t;g.crash={x:0,y:0};g.distance=mode.value==='street'?t*150:0;g.time=mode.value==='street'?t*20:0;g.policeDistance=mode.value==='street'?1.5+t*8.5:1.5;s.clock=mode.value==='intro'?t*INTRO_DURATION:t*4.6;s.render(g,.04);document.querySelector('output').textContent=mode.value==='intro'?`${(t*INTRO_DURATION).toFixed(2)} sec`:`${Math.round(t*100)}%`;requestAnimationFrame(frame);}
window.addEventListener('resize',()=>s.resize(canvas.clientWidth,canvas.clientHeight));frame();
</script></html>
