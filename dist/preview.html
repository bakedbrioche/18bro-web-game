<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>18Bro scene review</title>
<style>body{margin:0;background:#101820;color:#e6f0d5;font:14px system-ui}canvas{display:block;width:100vw;height:calc(100vh - 108px)}nav{min-height:90px;display:flex;flex-wrap:wrap;align-content:center;align-items:center;gap:10px;padding:8px 16px}input[type=range]{width:150px}input[type=number]{width:80px}a{color:#b9ed87}label{display:flex;align-items:center;gap:5px}select{max-width:180px}</style>
<canvas id="review"></canvas><nav><label>Scene <select id="scene"><option value="intro">Store heist</option><option value="capture">Police carry-away</option><option value="street">Opening street</option><option value="moped">Moped duck</option><option value="route">Connected route</option><option value="custom">Customization review</option><option value="flight">Jetpack</option></select></label><label>Timeline <input id="progress" type="range" min="0" max="100" step="1" value="0"></label><label>Distance <input id="distance" type="number" min="0" value="650"></label><label>Traffic time <input id="traffic" type="number" min="0" max="56" step=".5" value="16"></label><label>Fur <select id="fur"><option>black</option><option>cream</option><option>ginger</option><option>silver</option><option>pink</option><option>gold</option></select></label><label>Hat <select id="hat"><option>cap</option><option>none</option><option>beanie</option><option>sombrero</option><option>bucket</option><option>crown</option></select></label><output id="time"></output><a href="/">Back to game</a></nav>
<script type="module">
import {RunnerGame,INTRO_DURATION,CAPTURE_DURATION} from './core.mjs?v=street-28';import {GameScene} from './scene.mjs?v=street-28';
const canvas=document.querySelector('canvas'),s=new GameScene(canvas),g=new RunnerGame({random:()=>.37}),mode=document.querySelector('#scene'),progress=document.querySelector('#progress'),distance=document.querySelector('#distance'),traffic=document.querySelector('#traffic');
let dirty=true;document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>dirty=true));
function setup(){const t=Number(progress.value)/100;g.seekArea(mode.value==='route'?Number(distance.value):mode.value==='street'?t*150:0);g.player.slide=mode.value==='moped'?.72*(1-t):0;if(mode.value==='moped')g.powers.activate('moped');g.state=['intro','custom'].includes(mode.value)?'STARTING':mode.value==='capture'?'CAUGHT':'RUNNING';g.introProgress=mode.value==='custom'?0:t;g.captureProgress=t*2.5;if(mode.value==='flight'){g.activatePower('jetpack');g.player.y=9;}g.crash={x:0,y:0};g.policeDistance=10;g.speed=0;if(mode.value==='route'){const end=Number(traffic.value);for(let step=0;step<450;step++){g.time=end-7.5+step/60;g._updateCrossTraffic(1/60);for(const e of g.entities)if(e.active&&e.type==='crossTraffic')e.x+=e.crossSpeed/60;}g.time=end;}else g.entities.forEach(e=>e.active=false);g._refreshRoute();s.captureStarts=null;dirty=false;}
function frame(){if(dirty)setup();const t=Number(progress.value)/100;s.clock=mode.value==='intro'?t*INTRO_DURATION:mode.value==='capture'?t*CAPTURE_DURATION:t*4.6;s.render(g,.04,{fur:document.querySelector('#fur').value,hat:document.querySelector('#hat').value});document.querySelector('output').textContent=mode.value==='route'?`${g.distance} m / ${g.routeTraffic.id}`:mode.value==='intro'?`${(t*INTRO_DURATION).toFixed(2)} sec`:`${Math.round(t*100)}%`;requestAnimationFrame(frame);}
window.addEventListener('resize',()=>s.resize(canvas.clientWidth,canvas.clientHeight));frame();
</script></html>
