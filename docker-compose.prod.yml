name: 18bro

services:
  game:
    image: ${IMAGE:?Set IMAGE to the published GHCR image tag}
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    pids_limit: 100
    expose:
      - "80"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.18bro.loadbalancer.server.port=80"

      - "traefik.http.routers.18bro-domain-http.rule=(Host(`18bro.site`) || Host(`www.18bro.site`)) && PathPrefix(`/game`)"
      - "traefik.http.routers.18bro-domain-http.entrypoints=web"
      - "traefik.http.routers.18bro-domain-http.priority=100"
      - "traefik.http.routers.18bro-domain-http.middlewares=18bro-https-redirect"
      - "traefik.http.routers.18bro-domain-http.service=18bro"
      - "traefik.http.routers.18bro-domain-https.rule=(Host(`18bro.site`) || Host(`www.18bro.site`)) && PathPrefix(`/game`)"
      - "traefik.http.routers.18bro-domain-https.entrypoints=websecure"
      - "traefik.http.routers.18bro-domain-https.priority=100"
      - "traefik.http.routers.18bro-domain-https.tls=true"
      - "traefik.http.routers.18bro-domain-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.18bro-domain-https.middlewares=18bro-game-chain"
      - "traefik.http.routers.18bro-domain-https.service=18bro"
      - "traefik.http.middlewares.18bro-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.18bro-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.middlewares.18bro-game-slash.redirectregex.regex=^(https?://[^/]+/game)$$"
      - "traefik.http.middlewares.18bro-game-slash.redirectregex.replacement=$${1}/"
      - "traefik.http.middlewares.18bro-game-slash.redirectregex.permanent=true"
      - "traefik.http.middlewares.18bro-game-strip.stripprefix.prefixes=/game"
      - "traefik.http.middlewares.18bro-game-chain.chain.middlewares=18bro-game-slash,18bro-game-strip"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
